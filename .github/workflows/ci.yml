---
name: CI
# yamllint disable-line rule:truthy
on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check for tabs in shell scripts
        run: |
          if find . -name \*.sh -type f -exec grep -P "^\t" --line-number {} + ; then
              exit 1
          else
              exit 0
          fi
      - name: Run ShellCheck
        run: |
          find . -name \*.sh -type f -exec shellcheck {} +

      - name: Run yamllint
        run: |
          find . -name \*.yml -type f -exec yamllint -s -d '{extends: default, rules: {line-length: disable}}' {} +
